name: Build APK and AAB

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "worker/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "worker/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: llama.cpp manba kodini yuklab olish
        env:
          LLAMA_TAG: b11017
        run: |
          LLAMA_DIR="app/src/main/cpp/llama.cpp"
          if [ ! -f "$LLAMA_DIR/CMakeLists.txt" ]; then
            echo "llama.cpp ($LLAMA_TAG) GitHub'dan klonlanyapti..."
            rm -rf "$LLAMA_DIR"
            git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$LLAMA_DIR"
          else
            echo "llama.cpp allaqachon mavjud, klonlash shart emas."
          fi

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK litsenziyalarini qabul qilish va NDK o'rnatish
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager topilmadi, ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 3
            exit 1
          fi
          echo "Topildi: $SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: proot kutubxonalarini yuklash
        run: |
          chmod +x scripts/fetch-proot.sh
          scripts/fetch-proot.sh
          for f in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            test -f "app/src/main/jniLibs/arm64-v8a/$f" || { echo "::error::$f yo'q"; exit 1; }
          done

      - name: Ubuntu rootfs'ni tayyorlash (APK ichiga)
        run: |
          chmod +x scripts/build-rootfs.sh
          scripts/build-rootfs.sh
          test -s app/src/main/assets/linux/ubuntu-base-arm64.tar.xz || { echo "::error::rootfs yo'q"; exit 1; }

      # 1. Debug APK yig'ish
      - name: Debug APK yig'ish
        run: gradle assembleDebug --stacktrace

      - name: Debug APK ni artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: mobagent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          compression-level: 0

      # 2. Release AAB va Release APK yig'ish (Imzolangan)
      - name: Release AAB va APK yig'ish (imzolangan)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE secret topilmadi! GitHub Settings > Secrets bo'limida KEYSTORE_FILE yoki KEYSTORE_BASE64 mavjudligini tekshiring."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"

          # Ham AAB, ham Release APK yig'iladi
          gradle bundleRelease assembleRelease --stacktrace

          rm -f "$RUNNER_TEMP/upload.jks"

      # 3. Google Play uchun tayyor AAB faylni yuklash
      - name: Release AAB ni artifact sifatida yuklash
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mobagent-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # 4. Telefoningizda to'g'ridan-to'g'ri o'rnatib sinash uchun Release APK
      - name: Release APK ni artifact sifatida yuklash
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mobagent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
